{% extends "base.html" %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; height: 100%; margin-top: 10vh;">
    <div class="glass-panel" style="width: 100%; max-width: 400px; text-align: center;">
        <h2 style="margin-bottom: 2rem;">Acceso al Sistema ⚕️</h2>
        <form method="POST">
            <div class="form-group" style="text-align: left;">
                <label>Usuario</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="form-group" style="text-align: left;">
                <label>Contraseña</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-success" style="width: 100%; margin-top: 1rem;">Iniciar Sesión</button>
        </form>
        <p style="margin-top: 2rem; color: #94a3b8; font-size: 0.9rem;">
            ¿Problemas para acceder? <br>
            <br>
            <a href="{{ url_for('auth.register') }}" style="color: var(--primary);">Registra un nuevo usuario aquí</a>
        </p>
    </div>
</div>
{% endblock %}
